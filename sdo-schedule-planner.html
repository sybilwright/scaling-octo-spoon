<script>
// Browser-compatible replacement for the Claude-artifact-only window.storage API.
// Same async get/set/delete interface, backed by localStorage instead, so all the
// existing save/load code in the component works unchanged.
(function () {
  const PREFIX = "sdo-planner:";
  window.storage = {
    async get(key) {
      const raw = localStorage.getItem(PREFIX + key);
      if (raw === null) throw new Error("Key not found");
      return { key, value: raw };
    },
    async set(key, value) {
      localStorage.setItem(PREFIX + key, value);
      return { key, value };
    },
    async delete(key) {
      localStorage.removeItem(PREFIX + key);
      return { key, deleted: true };
    },
  };
})();
</script>

  }
});
</script>
