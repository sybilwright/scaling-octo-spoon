<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SDO Schedule Planner</title>
<style>
  html, body { margin: 0; padding: 0; background: #F5F7FA; min-height: 100vh; }
  #root { max-width: 1000px; margin: 0 auto; padding: 20px 12px; }
  @media (min-width: 700px) { #root { padding: 32px 20px; } }
</style>
</head>
<body>
<div id="root">
  <div style="color:#66707F; font-family: -apple-system, sans-serif; text-align:center; padding-top: 60px;">Loading…</div>
</div>

<script>
// Browser-compatible replacement for the Claude-artifact-only window.storage API.
// Same async get/set/delete interface, backed by localStorage instead, so all the
// existing save/load code in the component works unchanged.
(function () {
  const PREFIX = "sdo-planner:";
  window.storage = {
    async get(key) {
      const raw = localStorage.getItem(PREFIX + key);
      if (raw === null) throw new Error("Key not found");
      return { key, value: raw };
    },
    async set(key, value) {
      localStorage.setItem(PREFIX + key, value);
      return { key, value };
    },
    async delete(key) {
      localStorage.removeItem(PREFIX + key);
      return { key, deleted: true };
    },
  };
})();
</script>

<script>
window.addEventListener("error", function (e) {
  var root = document.getElementById("root");
  if (root && root.textContent.indexOf("Loading") !== -1) {
    root.innerHTML = '<div style="color:#B5650A; font-family:-apple-system,sans-serif; max-width:600px; margin:60px auto; padding:20px; line-height:1.6;">' +
      '<strong>Something failed to load.</strong><br><br>Error: ' + (e.message || "unknown") +
      '</div>';
  }
});
</script>
